spring.application.name=bakery-order-management-system
server.port=8080

# Thymeleaf resolves views from classpath:/templates/ with the .html suffix.
spring.thymeleaf.encoding=UTF-8

# Relative to the application working directory; override with BAKERY_DATA_DIRECTORY.
# Used by the TXT storage mode (and by the other team modules' sample files).
bakery.data-directory=${BAKERY_DATA_DIRECTORY:data}

# Storage mode: mongodb (default) or file. See docs/MONGODB_INTEGRATION.md.
bakery.storage.type=${BAKERY_STORAGE:mongodb}
# MongoDB Atlas connection URI:
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://kdk97961_db_user:i6vsVphfzVE2gC0m@cluster0.axwu6jm.mongodb.net/bakery_db?retryWrites=true&w=majority}
# Indexes and validators are created explicitly by the repositories, not by annotation scanning.
spring.data.mongodb.auto-index-creation=false

# User Management: development-only first-admin bootstrap (see docs/USER_MANAGEMENT.md).
# Off unless BAKERY_ADMIN_BOOTSTRAP=true.
bakery.admin.bootstrap.enabled=${BAKERY_ADMIN_BOOTSTRAP:true}
bakery.admin.bootstrap.email=${BAKERY_ADMIN_EMAIL:admin@bakery.test}
bakery.admin.bootstrap.password=${BAKERY_ADMIN_PASSWORD:kalana12345}
bakery.admin.bootstrap.name=${BAKERY_ADMIN_NAME:Bakery Admin}

# Customer "My Orders" link (Order Management is integrated on dev).
bakery.nav.my-orders-url=/orders/my-orders

# Session cookie hardening (the cookie is also HttpOnly by default).
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# ── Custom Cake Booking module ────────────────────────────────────────────────
# Directory where customer design reference images are saved.
# Override with BAKERY_CAKE_UPLOAD_DIR environment variable.
bakery.cake.upload-dir=${BAKERY_CAKE_UPLOAD_DIR:uploads/cake-designs}

# Allow multipart uploads up to 5 MB per file and 10 MB per request.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
# Payment Management: hard deletion of payments of ANY status (Paid, Pending, Refunded...) is a coursework/demo
# feature and is OFF here (production-safe). With it off, only Failed or Cancelled payments can be deleted.
# Turn it on only for the university demo: profile "coursework" or BAKERY_PAYMENT_HARD_DELETE=true.
bakery.payments.hard-delete.enabled=${BAKERY_PAYMENT_HARD_DELETE:false}
