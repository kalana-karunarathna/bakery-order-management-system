spring.application.name=bakery-order-management-system
server.port=8080

# Thymeleaf resolves views from classpath:/templates/ with the .html suffix.
spring.thymeleaf.encoding=UTF-8

# Relative to the application working directory; override with BAKERY_DATA_DIRECTORY.
# Used by the TXT storage mode (and by the other team modules' sample files).
bakery.data-directory=${BAKERY_DATA_DIRECTORY:data}

# User and Order Management storage: mongodb (default) or file. See docs/MONGODB_INTEGRATION.md.
bakery.storage.type=${BAKERY_STORAGE:mongodb}
# Local development default (authentication disabled, localhost only). Never commit real credentials;
# set MONGODB_URI in the environment instead.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/bakery_db}
# Indexes and validators are created explicitly by the repositories, not by annotation scanning.
spring.data.mongodb.auto-index-creation=false

# User Management: development-only first-admin bootstrap (see docs/USER_MANAGEMENT.md).
# Off unless BAKERY_ADMIN_BOOTSTRAP=true. There is deliberately no default email or password.
bakery.admin.bootstrap.enabled=${BAKERY_ADMIN_BOOTSTRAP:false}
bakery.admin.bootstrap.email=${BAKERY_ADMIN_EMAIL:}
bakery.admin.bootstrap.password=${BAKERY_ADMIN_PASSWORD:}
bakery.admin.bootstrap.name=${BAKERY_ADMIN_NAME:Bakery Admin}

# Customer "My Orders" link (Order Management is integrated on dev).
bakery.nav.my-orders-url=/orders/my-orders

# Session cookie hardening (the cookie is also HttpOnly by default).
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
