<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
  Order Management (Component 03) UI fragments.
  Kept inside the order module so the shared fragments/layout.html, css/style.css
  and js/app.js stay untouched for the other components.
-->

<!-- Storefront head (fonts, Bootstrap, style.css, storefront.css) plus the order-only stylesheet. -->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | Hearth &amp; Crumb Bakery'">Hearth &amp; Crumb Bakery</title>
    <th:block th:replace="~{fragments/storefront :: head-assets}"></th:block>
    <link rel="stylesheet" th:href="@{/css/orders.css}">
</head>
<body>

<!-- Inline SVG icon sprite. Use with: <svg class="o-icon" aria-hidden="true"><use href="#i-name"/></svg> -->
<svg th:fragment="icons" xmlns="http://www.w3.org/2000/svg" class="o-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12.1a1 1 0 0 1-1 .9H7.2a1 1 0 0 1-1-.9L5 8Z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-store" viewBox="0 0 24 24"><path d="M4 10v10h16V10"/><path d="M3 10l2-6h14l2 6H3Z"/><path d="M10 20v-5h4v5"/></symbol>
    <symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 6h11v10H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="M13.5 6.5l4 4"/></symbol>
    <symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2L12 3Z"/><path d="M12 10v5M12 18h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-whisk" viewBox="0 0 24 24"><path d="M7 14a4 4 0 1 1 1.5-7.7A4 4 0 0 1 16 5a4 4 0 0 1 1 7.9V20H7v-6Z"/><path d="M7 17h10"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-cake" viewBox="0 0 24 24"><path d="M4 21h16"/><path d="M5 21v-8h14v8"/><path d="M5 16c2 1.5 4.5 1.5 7 0s5-1.5 7 0"/><path d="M12 13V9"/><path d="M12 6.5c.8-.8.8-2 0-3-.8 1-.8 2.2 0 3Z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3Z"/><path d="M12 8v4M12 15h.01"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V3h9l9 9-9 9-9-9Z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol>
</svg>

<!-- Success / error flash messages set by OrderController (flash or model attributes). -->
<div th:fragment="flash" class="o-flash-stack">
    <div th:if="${successMessage}" class="o-alert o-alert--success alert alert-dismissible fade show" role="status">
        <svg class="o-icon" aria-hidden="true"><use href="#i-check-circle"/></svg>
        <span th:text="${successMessage}">Success</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Dismiss message"></button>
    </div>
    <div th:if="${errorMessage}" class="o-alert o-alert--error alert alert-dismissible fade show" role="alert">
        <svg class="o-icon" aria-hidden="true"><use href="#i-alert"/></svg>
        <span th:text="${errorMessage}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Dismiss message"></button>
    </div>
</div>

<!-- Compact status pill, e.g. in lists and tables. -->
<span th:fragment="status(order)" class="o-status"
      th:classappend="'o-status--' + ${#strings.toLowerCase(order.status.name())}">
    <span class="o-status-dot" aria-hidden="true"></span>
    <span th:text="${#strings.capitalize(#strings.toLowerCase(order.status.name()))}">Pending</span>
</span>

<!-- Pickup / Delivery pill. -->
<span th:fragment="type(order)" class="o-type">
    <th:block th:if="${order.orderType.name() == 'DELIVERY'}">
        <svg class="o-icon" aria-hidden="true"><use href="#i-truck"/></svg>Delivery
    </th:block>
    <th:block th:unless="${order.orderType.name() == 'DELIVERY'}">
        <svg class="o-icon" aria-hidden="true"><use href="#i-store"/></svg>Pickup
    </th:block>
</span>

<!-- Progress tracker derived only from the stored status (no invented dates or events). -->
<div th:fragment="progress(order)"
     th:with="s=${order.status.name()},
              idx=${s == 'PENDING' ? 0 : (s == 'PREPARING' ? 1 : (s == 'READY' ? 2 : (s == 'DELIVERED' ? 3 : -1)))},
              isDelivery=${order.orderType.name() == 'DELIVERY'}">
    <ol th:if="${idx >= 0}" class="o-progress" aria-label="Order progress">
        <li class="o-progress-step" th:classappend="${idx > 0} ? 'is-done' : (${idx == 0} ? 'is-current')"
            th:attr="aria-current=${idx == 0} ? 'step'">
            <span class="o-progress-icon"><svg class="o-icon" aria-hidden="true"><use href="#i-receipt"/></svg></span>
            <span class="o-progress-text"><strong>Pending</strong><small>Order received</small></span>
        </li>
        <li class="o-progress-step" th:classappend="${idx > 1} ? 'is-done' : (${idx == 1} ? 'is-current')"
            th:attr="aria-current=${idx == 1} ? 'step'">
            <span class="o-progress-icon"><svg class="o-icon" aria-hidden="true"><use href="#i-whisk"/></svg></span>
            <span class="o-progress-text"><strong>Preparing</strong><small>Being freshly made</small></span>
        </li>
        <li class="o-progress-step" th:classappend="${idx > 2} ? 'is-done' : (${idx == 2} ? 'is-current')"
            th:attr="aria-current=${idx == 2} ? 'step'">
            <span class="o-progress-icon"><svg class="o-icon" aria-hidden="true"><use href="#i-box"/></svg></span>
            <span class="o-progress-text"><strong>Ready</strong>
                <small th:text="${isDelivery} ? 'Ready for dispatch' : 'Ready for pickup'">Ready for pickup</small></span>
        </li>
        <li class="o-progress-step" th:classappend="${idx == 3} ? 'is-done is-current'"
            th:attr="aria-current=${idx == 3} ? 'step'">
            <span class="o-progress-icon"><svg class="o-icon" aria-hidden="true"><use href="#i-check-circle"/></svg></span>
            <span class="o-progress-text"><strong>Delivered</strong><small>Order completed</small></span>
        </li>
    </ol>
    <div th:if="${idx < 0}" class="o-progress-cancelled">
        <svg class="o-icon" aria-hidden="true"><use href="#i-x-circle"/></svg>
        <div>
            <strong>This order was cancelled</strong>
            <p class="mb-0">It will not be prepared. You can place a new order at any time.</p>
        </div>
    </div>
</div>

<!-- Accessible confirmation dialog used by forms with a data-confirm attribute (see js/orders.js). -->
<dialog th:fragment="confirm-dialog" id="orderConfirmDialog" class="o-dialog"
        aria-labelledby="orderConfirmTitle" aria-describedby="orderConfirmMessage">
    <div class="o-dialog-body">
        <span class="o-dialog-icon" aria-hidden="true"><svg class="o-icon"><use href="#i-alert"/></svg></span>
        <h2 id="orderConfirmTitle" class="o-dialog-title">Are you sure?</h2>
        <p id="orderConfirmMessage" class="o-dialog-message">This action cannot be undone.</p>
    </div>
    <div class="o-dialog-actions">
        <button type="button" class="btn btn-o-outline" data-dialog-cancel autofocus>Keep order</button>
        <button type="button" class="btn btn-o-danger" data-dialog-confirm>Confirm</button>
    </div>
</dialog>

<!-- Shared scripts plus the order-only enhancements. -->
<th:block th:fragment="scripts">
    <script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
    <script th:src="@{/js/storefront.js}" defer></script>
    <script th:src="@{/js/orders.js}" defer></script>
</th:block>

</body>
</html>
