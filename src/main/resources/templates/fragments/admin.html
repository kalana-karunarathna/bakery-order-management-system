<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  Reusable ADMIN layout (top bar + sidebar), owned by User Management.

  Other modules can build their admin pages with it:

    <head th:replace="~{fragments/admin :: head('Products admin', '/css/products-admin.css')}"></head>
    <body class="admin-ui">
    <header th:replace="~{fragments/admin :: topbar}"></header>
    <div class="a-shell">
        <nav th:replace="~{fragments/admin :: sidebar('products')}"></nav>
        <main id="main-content" class="a-content"> ... </main>
    </div>
    <th:block th:replace="~{fragments/admin :: scripts}"></th:block>

  Remember: the page must also be protected on the server (hasRole('ADMIN') in SecurityConfig
  and/or @PreAuthorize). Hiding links is not access control.

  Sidebar keys: dashboard, customers, products, orders, cakes, payments, feedback, profile.
  Module entries currently link to each module's existing page; update them to the module's
  admin route when one exists.
-->

<head th:fragment="head(pageTitle, extraCss)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title th:text="${pageTitle} + ' | Bakery Admin'">Bakery Admin</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link th:if="${extraCss != null}" rel="stylesheet" th:href="@{${extraCss}}">
</head>
<body>

<header th:fragment="topbar" class="a-topbar">
    <a class="skip-link btn btn-light" href="#main-content">Skip to content</a>
    <div class="a-topbar-inner">
        <button class="a-menu-toggle d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#admin-sidebar"
                aria-controls="admin-sidebar" aria-expanded="false" aria-label="Toggle admin menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <a class="a-brand" th:href="@{/users/admin}">
            <span class="a-brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 21V8"/><path d="M12 10c-2.5-.3-4-2-4.2-4.4 2.4.2 4 1.9 4.2 4.4Zm0 0c2.5-.3 4-2 4.2-4.4-2.4.2-4 1.9-4.2 4.4Z"/><path d="M12 15c-2.5-.3-4-2-4.2-4.4 2.4.2 4 1.9 4.2 4.4Zm0 0c2.5-.3 4-2 4.2-4.4-2.4.2-4 1.9-4.2 4.4Z"/></svg>
            </span>
            <span>Bakery <strong>Admin</strong></span>
        </a>
        <div class="a-topbar-actions">
            <a class="a-topbar-link d-none d-sm-inline-flex" th:href="@{/}">View site</a>
            <span class="a-user" sec:authorize="isAuthenticated()">
                <span class="a-user-avatar" aria-hidden="true"
                      th:text="${#strings.substring(#authentication.principal.fullName, 0, 1)}">A</span>
                <span class="a-user-name d-none d-md-inline" sec:authentication="principal.fullName">Admin</span>
            </span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="a-logout">Log out</button>
            </form>
        </div>
    </div>
</header>

<nav th:fragment="sidebar(active)" id="admin-sidebar" class="a-sidebar collapse d-lg-block" aria-label="Admin navigation">
    <div class="a-nav-group">
        <p class="a-nav-title">Overview</p>
        <a class="a-nav-link" th:href="@{/users/admin}" th:classappend="${active == 'dashboard'} ? 'is-active'"
           th:attr="aria-current=${active == 'dashboard'} ? 'page'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a>
        <a class="a-nav-link" th:href="@{/users/admin/customers}" th:classappend="${active == 'customers'} ? 'is-active'"
           th:attr="aria-current=${active == 'customers'} ? 'page'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1.2-3.5 3.7-5.2 6.5-5.2s5.3 1.7 6.5 5.2"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.9c1.7.7 3 2.4 3.5 5.1"/></svg>Customers</a>
    </div>

    <!-- Module pages: these link to each module's existing page until its admin tools are integrated. -->
    <div class="a-nav-group">
        <p class="a-nav-title">Modules</p>
        <a class="a-nav-link" th:href="@{/products}" th:classappend="${active == 'products'} ? 'is-active'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V3h9l9 9-9 9-9-9Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Products</a>
        <a class="a-nav-link" th:href="@{/orders/admin}" th:classappend="${active == 'orders'} ? 'is-active'" th:attr="aria-current=${active == 'orders'} ? 'page'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></svg>Orders</a>
        <a class="a-nav-link" th:href="@{/cake-bookings}" th:classappend="${active == 'cakes'} ? 'is-active'" th:attr="aria-current=${active == 'cakes'} ? 'page'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21h16"/><path d="M5 21v-8h14v8"/><path d="M5 16c2 1.5 4.5 1.5 7 0s5-1.5 7 0"/><path d="M12 13V9"/></svg>Custom Cake Bookings</a>
        <a class="a-nav-link" th:href="@{/payments/admin}" th:classappend="${active == 'payments'} ? 'is-active'" th:attr="aria-current=${active == 'payments'} ? 'page'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>Payments</a>
        <a class="a-nav-link" th:href="@{/feedback}" th:classappend="${active == 'feedback'} ? 'is-active'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4V5Z"/></svg>Feedback</a>
        <p class="a-nav-hint">Module admin tools will appear here as each module is integrated.</p>
    </div>

    <div class="a-nav-group">
        <p class="a-nav-title">Account</p>
        <a class="a-nav-link" th:href="@{/profile}" th:classappend="${active == 'profile'} ? 'is-active'">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Admin profile</a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="a-nav-link a-nav-button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></svg>Log out</button>
        </form>
    </div>
</nav>

<th:block th:fragment="scripts">
    <script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}" defer></script>
</th:block>

</body>
</html>
