<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('My Cake Bookings')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main id="main-content" class="container py-5">
    <a class="link-secondary" th:href="@{/}">← Back to home</a>
    <div class="d-flex align-items-center justify-content-between mt-4 mb-3 flex-wrap gap-2">
        <h1 class="display-6 fw-bold mb-0">🎂 Custom Cake Bookings</h1>
        <div class="d-flex gap-2">
            <a th:href="@{/cake-bookings/new}" class="btn btn-warning fw-semibold">+ New Booking</a>
        </div>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(bookings)}" class="card module-card">
        <div class="card-body p-4 text-center">
            <h2 class="h5">No bookings yet</h2>
            <p class="text-secondary mb-3">You haven't placed any cake bookings. Start by clicking "New Booking".</p>
            <a th:href="@{/cake-bookings/new}" class="btn btn-warning">Book Your First Cake</a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
