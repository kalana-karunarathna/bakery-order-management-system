<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{payment/fragments :: head('Payment help')}"></head>
<body class="payment-page" th:with="page='error'"><header th:replace="~{fragments/layout :: header}"></header><main id="main-content" class="container pay-main">
<div th:replace="~{payment/fragments :: brand}"></div>
<div class="pay-workspace"><aside th:replace="~{payment/fragments :: sidebar}"></aside><div class="pay-content">
<section class="pay-panel pay-empty pay-error-page"><div class="pay-empty-icon"><svg th:replace="~{payment/fragments :: icon('receipt')}"></svg></div><p class="pay-eyebrow">Let's get you back on track</p><h1>Payment could not be completed</h1><p role="alert" class="alert alert-danger" th:text="${error}"></p><p>Check your payment details or contact an administrator if you need help accessing a record.</p><a class="btn pay-primary" th:href="@{/payments}">Return to payment history</a></section>
</div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{payment/fragments :: scripts}"></th:block></body></html>
