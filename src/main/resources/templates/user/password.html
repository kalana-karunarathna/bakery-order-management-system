<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{user/fragments/user-ui :: head('Change password')}"></head>
<body class="user-ui">
<svg th:replace="~{user/fragments/user-ui :: icons}"></svg>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main-content" class="container u-main">
    <div class="u-narrow">
        <a th:href="@{/profile}" class="u-back"><svg class="u-icon" aria-hidden="true"><use href="#u-arrow-left"/></svg>My account</a>
        <header class="mb-4">
            <p class="u-eyebrow">Security</p>
            <h1 class="u-title">Change your password</h1>
            <p class="u-subtitle">Enter your current password, then choose a new one.</p>
        </header>

        <section class="u-card" aria-labelledby="pw-title">
            <h2 id="pw-title" class="u-card-title">New password</h2>
            <p class="u-card-sub">Use at least 8 characters with a letter and a number.</p>

            <div th:if="${#fields.hasErrors('passwordForm.*')}" class="u-alert u-alert--error" role="alert">
                <svg class="u-icon" aria-hidden="true"><use href="#u-alert"/></svg><span>Your password was not changed. Please check the fields below.</span>
            </div>

            <form th:action="@{/profile/password}" th:object="${passwordForm}" method="post" novalidate>
                <div th:replace="~{user/fragments/user-ui :: passwordField('currentPassword', 'Current password', 'current-password', false)}"></div>
                <div th:replace="~{user/fragments/user-ui :: passwordField('newPassword', 'New password', 'new-password', true)}"></div>
                <div th:replace="~{user/fragments/user-ui :: passwordField('confirmPassword', 'Confirm new password', 'new-password', false)}"></div>
                <div class="u-form-actions">
                    <button type="submit" class="btn btn-u-primary">
                        <svg class="u-icon" aria-hidden="true"><use href="#u-lock"/></svg>Update password
                    </button>
                    <a th:href="@{/profile}" class="btn btn-u-ghost">Cancel</a>
                </div>
            </form>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{user/fragments/user-ui :: scripts}"></th:block>
</body>
</html>
