# Test-only overrides (loaded in addition to src/main/resources/application.properties).
# Existing test suites use isolated TXT storage in temporary folders.
bakery.storage.type=file
# Safety net: even if a test enabled MongoDB without its own URI, it could never reach bakery_db.
# MongoDB tests set their own temporary database (bakery_test_<random>) and drop only that.
spring.data.mongodb.uri=mongodb://127.0.0.1:27017/bakery_test_unused
